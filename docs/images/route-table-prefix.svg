<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="18" fill="#f4f8ff"/><rect width="1100" height="80" rx="18" fill="#153d70"/><text x="550" y="52" fill="white" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle">라우팅 핵심: 기본 경로와 최장 프리픽스 일치</text><rect x="35" y="112" width="500" height="295" rx="16" fill="white" stroke="#91b8e9"/><text x="65" y="164" fill="#173c65" font-family="sans-serif" font-size="28" font-weight="bold">① 0.0.0.0/0</text><text x="65" y="210" fill="#173c65" font-family="sans-serif" font-size="23">모든 IPv4 목적지에 일치</text><text x="65" y="252" fill="#173c65" font-family="sans-serif" font-size="21">0.0.0.0 ~ 255.255.255.255</text><rect x="65" y="292" width="435" height="82" rx="12" fill="#fff0c0"/><text x="282" y="327" text-anchor="middle" fill="#6c4c00" font-family="sans-serif" font-size="21" font-weight="bold">모든 통신 허용이라는 뜻은 아님</text><text x="282" y="356" text-anchor="middle" fill="#6c4c00" font-family="sans-serif" font-size="18">보안 그룹·NACL은 별도</text><rect x="565" y="112" width="500" height="295" rx="16" fill="white" stroke="#91b8e9"/><text x="590" y="164" fill="#173c65" font-family="sans-serif" font-size="27" font-weight="bold">② 가장 구체적인 등록 경로</text><text x="590" y="207" fill="#173c65" font-family="sans-serif" font-size="21">목적지 IP: 10.0.2.20</text><text x="590" y="257" fill="#23724c" font-family="sans-serif" font-size="24">✓ 10.0.0.0/16 → local</text><text x="590" y="307" fill="#23724c" font-family="sans-serif" font-size="24">✓ 0.0.0.0/0 → IGW</text><rect x="590" y="333" width="445" height="52" rx="10" fill="#d8f3e6"/><text x="812" y="368" text-anchor="middle" fill="#155a3a" font-family="sans-serif" font-size="22" font-weight="bold">선택: /16 → local</text><rect x="35" y="433" width="1030" height="65" rx="12" fill="#dcecff"/><text x="550" y="474" fill="#173c65" font-family="sans-serif" font-size="22" text-anchor="middle">/32가 더 구체적이어도 테이블에 등록되지 않았다면 선택되지